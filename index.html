<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiIntel OSINT | Status</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #00ffcc;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 10px #00ffcc; }
        p { font-size: 1.2rem; color: #888; }
        .status { color: #fff; font-weight: bold; margin-top: 20px; }
        .bot-link {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: #00ffcc;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s;
        }
        .bot-link:hover { transform: scale(1.1); box-shadow: 0 0 30px #00ffcc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 DIGIINTEL</h1>
        <p>Elite OSINT Intelligence Platform</p>
        <div class="status">SERVER STATUS: <span style="color: #00ff00;">ONLINE</span></div>
        <a href="https://t.me/digiintelbot" class="bot-link">OPEN BOT IN TELEGRAM</a>
    </div>
</body>
</html>
